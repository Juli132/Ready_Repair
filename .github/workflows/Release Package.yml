name: Create Release Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build the JAR with Maven
      run: mvn -B clean package --file pom.xml

    - name: Verify ShopServer.class is in the JAR
      run: |
        jar tf target/ready-repair-jar-with-dependencies.jar | grep -q '^server/ShopServer.class$' \
          || (echo "FATAL: server/ShopServer.class missing from JAR." && \
              echo "Check that ShopServer.java lives at src/main/java/server/ShopServer.java" && \
              exit 1)
        echo "OK: ShopServer.class present in JAR"

    - name: Create custom JRE with jlink
      run: |
        jlink --module-path "$JAVA_HOME/jmods" \
              --add-modules java.base,java.datatransfer,java.desktop,java.instrument,java.logging,java.management,java.naming,java.net.http,java.prefs,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml \
              --output custom-jre \
              --compress=2 \
              --no-header-files \
              --no-man-pages

    - name: Verify bundled JRE works
      run: |
        ./custom-jre/bin/java.exe -version
        echo "OK: bundled JRE runs"

    - name: Prepare Release Package
      run: |
        mkdir release-package
        cp target/ready-repair-jar-with-dependencies.jar release-package/ready-repair.jar
        cp run.bat release-package/
        cp -r webpage release-package/
        cp -r custom-jre release-package/jre

    - name: Smoke-test the packaged JAR with the bundled JRE
      run: |
        cd release-package
        ./jre/bin/java.exe -jar ready-repair.jar &
        SERVER_PID=$!
        for i in $(seq 1 15); do
          if powershell -NoProfile -Command "try { \$c=New-Object Net.Sockets.TcpClient; \$c.Connect('127.0.0.1',4568); \$c.Close(); exit 0 } catch { exit 1 }"; then
            echo "OK: server responded on port 4568"
            kill $SERVER_PID 2>/dev/null || true
            exit 0
          fi
          sleep 1
        done
        echo "FATAL: server never came up on port 4568"
        kill $SERVER_PID 2>/dev/null || true
        exit 1

    - name: Create Archive (standard)
      run: |
        cd release-package
        7z a -tzip ../ready-repair-${{ github.ref_name }}-windows.zip *

    - name: Add empty data folder for portable variant
      run: |
        mkdir -p release-package/data
        touch release-package/data/.keep

    - name: Create Archive (portable)
      run: |
        cd release-package
        7z a -tzip ../ready-repair-${{ github.ref_name }}-windows-portable.zip *

    - name: Auto-Create Release (As Draft)
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        generate_release_notes: true
        files: |
          ready-repair-${{ github.ref_name }}-windows.zip
          ready-repair-${{ github.ref_name }}-windows-portable.zip