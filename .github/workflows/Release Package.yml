name: Create Release Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build the JAR with Maven
      run: mvn -B clean package --file pom.xml

    - name: Create custom JRE with jlink
      run: |
        jlink --module-path "$JAVA_HOME/jmods" \
              --add-modules java.base,java.datatransfer,java.desktop,java.instrument,java.logging,java.management,java.naming,java.net.http,java.prefs,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml \
              --output custom-jre \
              --compress=2 \
              --no-header-files \
              --no-man-pages

    - name: Prepare Release Package
      run: |
        mkdir release-package
        cp target/ready-repair.jar release-package/
        cp run.bat release-package/
        cp -r webpage release-package/
        cp -r custom-jre release-package/jre

    - name: Create Archive
      run: |
        cd release-package
        7z a -tzip ../ready-repair-${{ github.ref_name }}-windows.zip *

    - name: Auto-Create Release (As Draft)
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        generate_release_notes: true
        files: ready-repair-${{ github.ref_name }}-windows.zip
