<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ready, Set, Repair</title>
    <link rel="stylesheet" href="styles/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <!-- Sidebar Queue -->
    <div class="sidebar">
      <div class="sidebar-header">
        My Repair Queue

        <div class="sidebar-actions">
          <button id="btnReimport" class="btn btn-small" onclick="reimportStored()" style="display:none;">↻ Refresh from sheet</button>
          <button id="btnToggleImport" class="btn btn-small" onclick="toggleImportPanel()">+ Add jobs from Excel</button>
          <button class="btn btn-small btn-danger-outline" onclick="clearAllJobs()">Clear all</button>
        </div>

        <div id="importPanel" class="import-panel" style="display: none;">
          <input type="file" id="excelFile" accept=".xlsx, .xls" />
          <button onclick="previewExcel()" class="btn btn-small" id="btnPreview">Preview</button>

          <div id="mappingGateway" class="mapping-gateway">
            <div class="mapping-gateway-title">Which columns go where?</div>
            <div id="radioListContainer" class="radio-list"></div>
            <button onclick="executeImport()" class="btn btn-wide">Confirm &amp; Import</button>
          </div>
        </div>
      </div>
      <ul class="queue-list" id="queueList">
        <!-- Populated by JS -->
      </ul>
    </div>

    <!-- Main Workbench Area -->
    <div class="workbench">
      <div class="header">
        <h1 id="activeId">Select a PC</h1>
        <span id="activeStatus"></span>
      </div>

      <div class="workbench-columns">
        <div class="workbench-left">
          <div class="card">
            <h2>Hardware Profile</h2>
            <div class="data-grid">
              <div class="data-field">
                <strong>Symptoms</strong>
                <div id="sympData">-</div>
              </div>
              <div class="data-field">
                <strong>Hardware Specs</strong>
                <div id="hwData">-</div>
              </div>
            </div>
          </div>

          <div class="card card-grow">
            <h2>Manual Repair Notes</h2>
            <textarea id="manualNotes" class="notes-textarea" placeholder="Enter notes on what you actually fixed..."></textarea>
            <div class="save-bar">
              <button class="btn" onclick="saveNotes()">Save to Local JSON</button>
            </div>
          </div>
        </div>

        <div class="card ai-section card-ai">
          <div class="ai-header">
            <h2>AI Diagnostic Assistant</h2>
            <button class="btn" id="btnGroq" onclick="simulateGroqCall()">Generate Steps</button>
          </div>

          <div class="ai-output" id="aiOutput">
            <span class="placeholder-text">Click "Generate Steps" to request a troubleshooting checklist...</span>
          </div>

          <div class="followup-wrapper">
            <div class="mode-toggle-bar">
              <span class="mode-label">Mode:</span>
              <button type="button" id="modeLog" class="mode-chip active" onclick="setQuestionMode('log')">📝 Log &amp; Save</button>
              <button type="button" id="modeAsk" class="mode-chip" onclick="setQuestionMode('ask')">💬 Just Ask</button>
              <button type="button" class="btn btn-danger" onclick="clearAIHistory()">Clear History</button>
            </div>
            <div class="followup-input-row">
              <input type="text" id="followUpInput" placeholder="Type observation or question (Press Enter)..." />
              <button id="btnSubmitQuery" class="btn" onclick="submitBenchQuery()">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="scripts/app.js"></script>
  </body>
</html>
